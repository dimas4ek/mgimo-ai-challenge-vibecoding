name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  # Required checks for branch protection: "test (ubuntu-latest)" and "test (windows-latest)".
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      # Same commands as in CLAUDE.md.
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Prod image and the whole compose stack (Postgres + API + Caddy) start and answer on / and /api/health.
  # Linux only: Docker is needed for deployment, not for development (.claude/rules/cross-platform.md).
  docker:
    runs-on: ubuntu-latest
    env:
      DOMAIN: localhost
      POSTGRES_PASSWORD: ci-only-not-a-secret
    steps:
      - uses: actions/checkout@v7
      - run: docker compose -f deploy/compose.yml up -d --build --wait
      - run: curl -fsSk https://localhost/api/health
      - run: curl -fsSk https://localhost/ | grep -q 'id="root"'
      - if: failure()
        run: docker compose -f deploy/compose.yml logs
      - if: always()
        run: docker compose -f deploy/compose.yml down -v
